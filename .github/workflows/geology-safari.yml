name: Safari student review and section tests
on:
  push:
    branches: [qa/geology-safari]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Enable Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Test published page in Safari
        shell: bash
        run: |
          /usr/bin/safaridriver -p 4444 > /tmp/geology-safari-driver.log 2>&1 &
          driver=$!
          trap 'kill "$driver" 2>/dev/null || true; cat /tmp/geology-safari-driver.log' EXIT
          python3 - <<'PY'
          import json, time, urllib.request
          base = "http://127.0.0.1:4444"
          def request(method, path, data=None):
              content = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(base + path, content, {"Content-Type": "application/json"}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      return json.load(response)["value"]
              except urllib.error.HTTPError as error:
                  raise RuntimeError(error.read().decode()) from error
          for _ in range(25):
              try:
                  request("GET", "/status")
                  break
              except (OSError, RuntimeError):
                  time.sleep(1)
          value = request("POST", "/session", {"capabilities": {"alwaysMatch": {"browserName": "safari"}}})
          assert value["capabilities"]["browserName"].lower() == "safari", value
          session = "/session/" + value["sessionId"]
          def script(js, *args):
              return request("POST", session + "/execute/sync", {"script": js, "args": list(args)})
          def click(selector):
              element = request("POST", session + "/element", {"using": "css selector", "value": selector})
              request("POST", session + "/element/" + element["element-6066-11e4-a52e-4f735466cecf"] + "/click", {})
          try:
              url = "https://fangchiwei-1104.github.io/qingchun-game/geology-review/"
              for _ in range(12):
                  request("POST", session + "/url", {"url": url})
                  if script("return !!document.querySelector('#s0.on #ox0 button')"):
                      break
                  time.sleep(5)
              assert script("return !!document.querySelector('#s0.on #ox0 button')")
              assert "Safari/" in script("return navigator.userAgent")
              click("#s0 .ox:first-child button:first-child")
              click("#s0 .ox:first-child button:last-child")
              assert script("return !!document.querySelector('#s0 .ox.done')")
              click("#dots button:nth-child(3)")
              assert script("return !!document.querySelector('#s2.on #plateSvg rect')")
              click("button[onclick='go(9)']")
              click("#assessment button")
              for question in range(15):
                  assert script("return document.querySelector('#assessment .assessment-nav button:last-child').disabled")
                  click("#assessment .opt:first-child")
                  click("#assessment .assessment-nav button:last-child")
              assert "/15" in script("return document.querySelector('.assessment-score').textContent").replace("／", "/").replace(" ", "")
              assert script("return !!document.querySelector('input[name=\"seat\"]')")
              request("POST", session + "/refresh", {})
              click("button[onclick='go(9)']")
              assert script("return !!document.querySelector('.assessment-score')")
              print("PASS: Safari", value["capabilities"]["browserVersion"], "opened GitHub Pages, ran practice, rendered SVG, completed and restored the 15-question score.")
              url = "https://fangchiwei-1104.github.io/qingchun-game/work-energy-review/"
              for _ in range(15):
                  request("POST", session + "/url", {"url": url})
                  if script("return !!document.querySelector('#s0.on #ox0 button')"):
                      break
                  time.sleep(5)
              assert script("return !!document.querySelector('#s0.on #ox0 button')")
              click("#dots button:nth-child(2)")
              assert script("return !!document.querySelector('#s1.on svg')")
              click("button[onclick='go(11)']")
              for unit in range(1, 5):
                  click("#testUnitNav button:nth-child(%d)" % unit)
                  click("#assessment button")
                  for question in range(1, 11):
                      assert script("return document.querySelector('#assessment h3').textContent").startswith("第 %d／10" % question)
                      assert script("return document.querySelector('#assessment .assessment-nav button:last-child').disabled")
                      click("#assessment .opt:first-child")
                      click("#assessment .assessment-nav button:last-child")
                  assert "／10" in script("return document.querySelector('.assessment-score').textContent")
                  assert script("return !!document.querySelector('#assessment input[name=classCode]')")
                  assert script("return !!document.querySelector('#assessment button[type=submit]')")
              request("POST", session + "/refresh", {})
              click("button[onclick='go(11)']")
              for unit in range(1, 5):
                  click("#testUnitNav button:nth-child(%d)" % unit)
                  assert script("return !!document.querySelector('.assessment-score')")
              print("PASS: Safari", value["capabilities"]["browserVersion"], "completed and restored all four 10-question tests and verified their upload forms.")
              url = "https://fangchiwei-1104.github.io/qingchun-game/biology-701-review/"
              for _ in range(15):
                  request("POST", session + "/url", {"url": url})
                  if script("return !!document.querySelector('#s0.on #ox0 button')"):
                      break
                  time.sleep(5)
              assert script("return !!document.querySelector('#s0.on #ox0 button')")
              click("#dots button:nth-child(2)")
              assert script("return !!document.querySelector('#s1.on svg')")
              click("button[onclick='go(11)']")
              for unit in range(1, 5):
                  click("#testUnitNav button:nth-child(%d)" % unit)
                  click("#assessment button")
                  for question in range(1, 11):
                      assert script("return document.querySelector('#assessment h3').textContent").startswith("第 %d／10" % question)
                      click("#assessment .opt:first-child")
                      click("#assessment .assessment-nav button:last-child")
                  assert "／10" in script("return document.querySelector('.assessment-score').textContent")
                  assert script("return document.querySelector('#assessment input[name=classNo]').value") == "701"
                  assert script("return !!document.querySelector('#assessment button[type=submit]')")
              request("POST", session + "/refresh", {})
              click("button[onclick='go(11)']")
              for unit in range(1, 5):
                  click("#testUnitNav button:nth-child(%d)" % unit)
                  assert script("return !!document.querySelector('.assessment-score')")
              print("PASS: Safari", value["capabilities"]["browserVersion"], "completed all biology 701 section tests and verified their upload forms.")
              url = "https://fangchiwei-1104.github.io/qingchun-game/biology-701-nutrition/"
              for _ in range(16):
                  request("POST", session + "/url", {"url": url})
                  if script("return !!document.querySelector('#s0.on #ox0 button')"):
                      break
                  time.sleep(5)
              assert script("return !!document.querySelector('#s0.on #ox0 button')")
              click("button[onclick='go(11)']")
              for i in range(1, 5):
                  click("#testUnitNav button:nth-child(%d)" % i)
                  click("#assessment button")
                  original = script("return currentTest.items.map(item => item.bankIndex)")
                  assert len(set(original)) == 10
                  for question in range(10):
                      option = script("const item = currentTest.items[questionIndex]; return item.order.indexOf((BANK[item.bankIndex].a + 1) % 4) + 1")
                      click("#assessment .opt:nth-child(%d)" % option)
                      click("#assessment .assessment-nav button:last-child")
                  assert script("return document.querySelector('.assessment-score').textContent").startswith("0 分")
                  assert script("return document.querySelector('#assessment input[name=classNo]').value") == "701"
                  click("#assessment > button")
                  expected_stage = 2 * i - 1
                  assert script("return document.querySelector('.stage.on').id") == "s" + str(expected_stage)
                  click("#s%d button[onclick*='openUnitTest']" % expected_stage)
                  click("#assessment > button")
                  retry = script("return currentTest.items.map(item => item.bankIndex)")
                  assert len(set(retry)) == 10 and len(set(retry) - set(original)) == 5, [original, retry]
                  assert script("return currentTest.history.length") == 1
              print("PASS: Safari", value["capabilities"]["browserVersion"], "checked all four 701 nutrition review-and-retake flows with exactly five replacement questions each.")
          finally:
              request("DELETE", session)
          PY
