<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>青春情誼園遊會</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: 課本手帳風——左側舞台＋對話框，右側人際數值、人格傾向與結局收集；手機時上下堆疊 */
:root {
  --bg: #F3F4FA;
  --surface: #FFFFFF;
  --grid: #E3E6F2;
  --ink: #2B2540;
  --muted: #6C6784;
  --line: #D9DBEA;
  --hl: #FFD84D;
  --hl-ink: #3A2E00;
  --hl-soft: #FFF4C7;
  --plum: #7A5BA8;
  --plum-soft: #EEE7F8;
  --mint: #2F9A83;
  --mint-soft: #E1F4EE;
  --rose: #D24A6E;
  --rose-soft: #FCE6EC;
  --sky: #3B7BC8;
  --sky-soft: #E2EEFB;
  --amber: #C7861A;
  --shadow: 0 1px 0 rgba(43,37,64,.06), 0 8px 24px -12px rgba(43,37,64,.25);
  --stage-dim: none;
  --f-display: "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-text: "LXGW WenKai TC", "PingFang TC", "Microsoft JhengHei", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141E; --surface: #211E2C; --grid: #24212F; --ink: #EDEAF6; --muted: #A49FBA;
    --line: #36324A; --hl: #F2C93B; --hl-ink: #2A2100; --hl-soft: #3A3218; --plum: #B79BE3; --plum-soft: #2E2742;
    --mint: #5CC8AE; --mint-soft: #1D332E; --rose: #F07A98; --rose-soft: #3A2030; --sky: #7FB2EE; --sky-soft: #1E2A3A; --amber: #E8B04F;
    --shadow: 0 8px 24px -12px rgba(0,0,0,.6); --stage-dim: brightness(.82) saturate(.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16141E; --surface: #211E2C; --grid: #24212F; --ink: #EDEAF6; --muted: #A49FBA;
  --line: #36324A; --hl: #F2C93B; --hl-ink: #2A2100; --hl-soft: #3A3218; --plum: #B79BE3; --plum-soft: #2E2742;
  --mint: #5CC8AE; --mint-soft: #1D332E; --rose: #F07A98; --rose-soft: #3A2030; --sky: #7FB2EE; --sky-soft: #1E2A3A; --amber: #E8B04F;
  --shadow: 0 8px 24px -12px rgba(0,0,0,.6); --stage-dim: brightness(.82) saturate(.9);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--f-text);
  font-size: 17px;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-display); flex-wrap: wrap; }
.brand b { font-size: 22px; letter-spacing: .04em; }
.brand span { color: var(--muted); font-size: 14px; }
.ghost { background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; font-family: var(--f-display); font-size: 14px; }
.ghost:hover { border-color: var(--plum); color: var(--plum); }
.ghost[aria-pressed="true"] { background: var(--plum-soft); border-color: var(--plum); color: var(--plum); }

/* home */
.hero { display: grid; gap: 14px; padding-block: 12px 4px; }
.hero .unit { font-family: var(--f-display); font-size: 14px; color: var(--muted); letter-spacing: .12em; }
.hero h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(38px, 7vw, 68px); line-height: 1.1; text-wrap: balance; }
.hero h1 mark { background: linear-gradient(transparent 55%, var(--hl) 55% 92%, transparent 92%); color: inherit; padding: 0 .06em; }
.hero p { margin: 0; max-width: 42em; color: var(--muted); }
.chapters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .chapters { grid-template-columns: 1fr; } }
.ch-card { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 0; overflow: hidden; display: grid; grid-template-rows: auto 1fr; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
.ch-card:hover { transform: translateY(-3px); border-color: var(--plum); }
.ch-card .thumb { height: 150px; position: relative; overflow: hidden; filter: var(--stage-dim); }
.ch-card .body { padding: 14px 18px 18px; display: grid; gap: 6px; align-content: start; }
.ch-card .no { font-family: var(--f-display); font-size: 13px; color: var(--plum); letter-spacing: .1em; }
.ch-card h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.ch-card .role { font-size: 15px; color: var(--muted); }
.ch-card .skills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-family: var(--f-display); font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--plum-soft); color: var(--plum); }
.ch-card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-family: var(--f-display); font-size: 14px; color: var(--muted); }
.ch-card .go { color: var(--plum); }
.ocean-intro { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 20px; display: grid; gap: 10px; }
.ocean-intro h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.ocean-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 860px) { .ocean-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .ocean-grid { grid-template-columns: 1fr; } }
.ocean-grid div { border-radius: 12px; padding: 10px 12px; background: var(--bg); font-size: 14.5px; display: grid; gap: 2px; align-content: start; }
.ocean-grid b { font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .howto { grid-template-columns: 1fr; } }
.howto div { background: var(--surface); border-radius: 14px; padding: 12px 16px; border: 1px dashed var(--line); font-size: 15px; }
.howto b { font-family: var(--f-display); font-weight: 400; display: block; color: var(--plum); }

/* trait colors */
.t-O { --tc: var(--plum); } .t-C { --tc: var(--sky); } .t-E { --tc: var(--amber); } .t-A { --tc: var(--mint); } .t-N { --tc: var(--rose); }
.tchip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-size: 12.5px; color: var(--tc); border: 1.5px solid var(--tc); border-radius: 999px; padding: 1px 10px; }
.tchip i { font-style: normal; font-weight: 700; }
.ocean-grid b { color: var(--tc); }

/* game */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .game { grid-template-columns: 1fr; } }
.main { display: grid; gap: 14px; min-width: 0; }
.stage { position: relative; aspect-ratio: 16 / 8.2; max-width: 100%; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); filter: var(--stage-dim); }
@media (max-width: 600px) { .stage { aspect-ratio: 4 / 3; } }
.place { position: absolute; top: 12px; left: 12px; z-index: 5; background: rgba(255,255,255,.88); color: #2B2540; font-family: var(--f-display); font-size: 13px; padding: 3px 12px; border-radius: 999px; }
.cast { position: absolute; inset: auto 0 0 0; height: 82%; display: flex; justify-content: center; align-items: flex-end; gap: 2%; z-index: 3; }
.actor { height: 100%; position: relative; transition: transform .25s, filter .25s, opacity .25s; transform-origin: bottom center; }
.actor svg { height: 100%; width: auto; display: block; }
.actor.dim { filter: saturate(.5) brightness(.85); opacity: .78; transform: scale(.94); }
.actor.on { transform: scale(1.02); }
.actor .tag { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: #2B2540; color: #fff; font-family: var(--f-display); font-size: 12px; padding: 1px 9px; border-radius: 6px; white-space: nowrap; }
.actor .tag.me { background: #F2B705; color: #2A2100; }
@media (prefers-reduced-motion: no-preference) {
  .actor.bounce { animation: bounce .45s ease; }
  @keyframes bounce { 40% { transform: translateY(-6%); } }
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
}

.deco { position: absolute; inset: 0; }
.bg-room { background: linear-gradient(#F4E1D2 0 70%, #C99B76 70%); }
.bg-room.night { background: linear-gradient(#3B3F6B 0 70%, #6E5A4C 70%); }
.bg-room .win { position: absolute; left: 8%; top: 12%; width: 26%; height: 40%; background: linear-gradient(#9FD3F2, #D8F0FB); border: 8px solid #fff; border-radius: 6px; box-shadow: inset 0 0 0 2px #E2C7B2; }
.bg-room.night .win { background: radial-gradient(circle at 70% 30%, #FFF6C9 0 8%, transparent 9%), linear-gradient(#1B2147, #2E3670); border-color: #CFCFE0; }
.bg-room .mirror { position: absolute; right: 9%; top: 8%; width: 18%; height: 58%; background: linear-gradient(135deg, #E8F4FA 30%, #CFE3EE 31% 40%, #E8F4FA 41%); border: 7px solid #B88A62; border-radius: 50% / 40%; }
.bg-classroom { background: linear-gradient(#E6EEE3 0 66%, #C8A57C 66%); }
.bg-classroom .board { position: absolute; left: 13%; right: 13%; top: 9%; height: 42%; background: #2F5D4A; border: 7px solid #8B6A43; border-radius: 4px; color: #F4F1E6; display: flex; align-items: center; justify-content: center; gap: 12%; font-family: var(--f-text); font-size: clamp(16px, 3.4vw, 34px); }
.bg-classroom .board small { display: block; text-align: center; font-size: .9em; }
.bg-fair { background: linear-gradient(#BFE6F7 0 60%, #A9D58B 60%); }
.bg-fair .tent { position: absolute; left: 4%; right: 4%; top: 5%; height: 18%; background: repeating-linear-gradient(90deg, #E2485B 0 9%, #FFF 9% 18%); border-radius: 6px 6px 40% 40% / 6px 6px 30% 30%; }
.bg-fair .pole { position: absolute; top: 20%; width: 1.6%; height: 70%; background: #B9BDC8; }
.bg-fair .sign { position: absolute; right: 7%; top: 30%; background: #FFF8E4; color: #2B2540; border: 3px solid #E2485B; border-radius: 6px; padding: 4px 10px; font-family: var(--f-text); font-weight: 700; font-size: clamp(12px, 2.2vw, 20px); line-height: 1.3; text-align: center; transform: rotate(3deg); }
.bg-fair .sign s { color: #A0A0A0; }
.bg-fair .sign em { font-style: normal; color: #E2485B; }
.bg-park { background: linear-gradient(#FBD9B5 0, #F7E9CF 50%, #9BCB8A 50%); }
.bg-park .tree { position: absolute; bottom: 44%; width: 18%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8CC97A, #4F9A55); }
.bg-park .track { position: absolute; left: 0; right: 0; bottom: 20%; height: 10%; background: #D9785B; opacity: .7; }

/* dialog */
.dialog { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px 20px 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-height: 150px; align-content: start; }
.who { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 15px; }
.who .nm { background: var(--ink); color: var(--surface); padding: 1px 12px; border-radius: 8px; }
.who .nm.me { background: var(--hl); color: var(--hl-ink); }
.who .nar { color: var(--muted); }
.line { font-size: 19px; line-height: 1.75; margin: 0; min-height: 2.4em; }
.line.narr { color: var(--muted); font-size: 17px; }
.next { justify-self: end; background: var(--ink); color: var(--surface); border: 0; border-radius: 999px; padding: 7px 18px; font-family: var(--f-display); font-size: 14px; }
.next:hover { background: var(--plum); }
.q { margin: 0; font-family: var(--f-display); font-size: 18px; line-height: 1.55; }
.qtag { display: inline-block; font-family: var(--f-display); font-size: 12.5px; background: var(--hl); color: var(--hl-ink); padding: 1px 10px; border-radius: 6px; margin-bottom: 4px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 14px; font-size: 16.5px; line-height: 1.6; display: flex; gap: 10px; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--plum); background: var(--plum-soft); }
.opt .k { font-family: var(--f-display); color: var(--plum); flex: none; }
.opt:disabled { cursor: default; opacity: .5; }
.opt.picked { opacity: 1; border-color: var(--tc, var(--plum)); background: var(--plum-soft); }
.opt .tchip { margin-left: auto; flex: none; align-self: center; }
.picked-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 8px 20px; font-family: var(--f-display); font-size: 15px; background: var(--ink); color: var(--surface); }
.btn:hover { background: var(--plum); }
.btn.alt { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.alt:hover { border-color: var(--plum); color: var(--plum); }

/* 機率條 */
.dice { display: grid; gap: 8px; }
.dice .cap { font-family: var(--f-display); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dice .track { position: relative; display: flex; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); }
.dice .seg { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 12px; line-height: 1.2; color: var(--ink); white-space: nowrap; overflow: hidden; padding: 0 4px; border-right: 1.5px solid var(--surface); }
.dice .seg:first-child { border-radius: 8px 0 0 8px; }
.dice .seg:last-child { border-right: 0; border-radius: 0 8px 8px 0; }
.dice .seg span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.dice .seg small { font-variant-numeric: tabular-nums; color: var(--muted); }
.dice .s0 { background: var(--mint-soft); } .dice .s1 { background: var(--sky-soft); } .dice .s2 { background: var(--rose-soft); } .dice .s3 { background: var(--hl-soft); }
.dice .seg.hit { outline: 3px solid var(--plum); outline-offset: -3px; }
.dice .pin { position: absolute; top: -7px; bottom: -7px; width: 4px; margin-left: -2px; background: var(--ink); border-radius: 2px; left: 0; }
@media (prefers-reduced-motion: no-preference) { .dice .pin { transition: left 1.1s cubic-bezier(.15,.85,.25,1); } }
.dice .res { font-family: var(--f-display); font-size: 16px; }
.dice .res b { color: var(--plum); font-weight: 400; }

.card { background: var(--plum-soft); border-radius: 14px; padding: 14px 18px; display: grid; gap: 8px; }
.card h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 19px; color: var(--plum); }
.card p { margin: 0; }

.msg { background: var(--bg); border: 1.5px dashed var(--plum); border-radius: 14px; padding: 12px 16px; display: grid; gap: 6px; font-size: 17px; }
.slot { display: flex; gap: 10px; align-items: baseline; }
.slot .n { font-family: var(--f-display); font-size: 12px; background: var(--plum); color: #fff; border-radius: 999px; width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
.slot .t { color: var(--muted); }
.slot.filled .t { color: var(--ink); }
.slot.now .t { color: var(--plum); font-family: var(--f-display); }

textarea { width: 100%; min-height: 96px; resize: vertical; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
textarea:focus { border-color: var(--plum); outline: none; }

/* side */
.side { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; }
.panel h5 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 14px; color: var(--muted); letter-spacing: .08em; }
.meter { display: grid; gap: 4px; }
.meter .lab { display: flex; justify-content: space-between; font-family: var(--f-display); font-size: 14px; }
.meter .lab span:last-child { font-variant-numeric: tabular-nums; }
.meter .delta { font-size: 12px; margin-left: 6px; }
.meter .delta.up { color: var(--mint); } .meter .delta.down { color: var(--rose); }
.bar { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--mint); transition: width .5s ease; }
.bar i.warn { background: var(--rose); }
.bar i.tc { background: var(--tc); }
.progress { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--plum); transition: width .3s; }
.ends { display: grid; gap: 6px; font-size: 15px; }
.ends div { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.ends div::before { content: "？"; width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-size: 12px; flex: none; }
.ends div.got { color: var(--ink); }
.ends div.got::before { content: "✓"; border: 1.5px solid var(--mint); background: var(--mint-soft); color: var(--mint); }

/* result */
.result { display: grid; gap: 14px; }
.end-title { font-family: var(--f-display); font-size: clamp(24px, 4vw, 32px); margin: 0; line-height: 1.3; }
.end-text { margin: 0; font-size: 18px; }
.advice { display: grid; gap: 10px; }
.adv-group { display: grid; gap: 6px; }
.adv-group > span { font-family: var(--f-display); font-size: 14px; }
.adv-group.good > span { color: var(--mint); }
.adv-group.mix > span { color: var(--plum); }
.adv-group.grow > span { color: var(--rose); }
.adv-item { background: var(--surface); border-radius: 12px; padding: 8px 12px; font-size: 15.5px; display: grid; gap: 2px; }
.adv-item b { font-family: var(--f-display); font-weight: 400; }
.ocean-result { display: grid; gap: 8px; }
.ocean-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3em; gap: 10px; align-items: center; font-family: var(--f-display); font-size: 14px; }
.ocean-row span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.ocean-row .bar { height: 12px; }
.review { display: grid; gap: 8px; }
.rev { border-left: 3px solid var(--tc, var(--line)); padding: 2px 0 2px 12px; font-size: 15px; display: grid; gap: 2px; }
.rev .rq { color: var(--muted); font-size: 13.5px; }
.rev .ro { font-family: var(--f-display); font-size: 13px; color: var(--plum); }
.rev .rn { color: var(--muted); }
details.more summary { cursor: pointer; font-family: var(--f-display); color: var(--plum); }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* ================= 五大人格特質 ================= */
const TRAITS = {
  O: { name: '開放性', en: 'Openness', desc: '好奇、有創意，喜歡嘗試新做法、接納不同觀點。',
       str: '你常想出新的解決方法，也願意從不同角度看事情，這能讓卡住的討論重新動起來。',
       tip: '新點子很好，但記得先和大家確認，避免改變了已經說好的約定。' },
  C: { name: '盡責性', en: 'Conscientiousness', desc: '有計畫、守規則、負責任，做事有條理。',
       str: '你守約定、有條理，讓人覺得可靠，這是長久信任的基礎。',
       tip: '處理事情很重要，但也別忘了先接住對方的情緒；規則之外，也需要一點彈性。' },
  E: { name: '外向性', en: 'Extraversion', desc: '主動、熱情，喜歡與人互動、帶動氣氛。',

function decor(bg, extra = {}) {
  if (bg === 'room') return '<div class="win"></div><div class="mirror"></div>';

  return '';

const toLine = l => Array.isArray(l) ? { who: l[0], mood: l[1], text: l[2] } : l;

function startChapter(idx) {
  const ch = CHAPTERS[idx];
  const carry = ch.id === 'c3' ? P.carry : null;
  S = { ci: idx, i: 0, st: { msg: 50 }, f: {}, carry, vars: {}, queue: [], jump: null, hist: [], delta: {},
        T: { O: 0, C: 0, E: 0, A: 0, N: 0 },
        bg: 'classroom', night: false, place: '', cast: [], moods: {}, speaker: null, extra: {}, ending: null };
  ch.meters.forEach(m => S.st[m.id] = typeof m.start === 'function' ? m.start(carry) : m.start);
  advance();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function labelIndex(id) { return chap().nodes.findIndex(n => n.t === 'label' && n.id === id); }

function advance() {
  for (;;) {
    const n = node();
    if (!n) return;
    if (n.when && !n.when(S)) { S.i++; continue; }
    if (n.t === 'scene') {
      S.bg = n.bg; S.night = !!n.night; S.place = n.place; S.cast = n.cast; S.moods = {}; S.speaker = null;
      S.extra = n.keep ? S.extra : { board: n.board, sign: n.sign };
      S.i++; continue;
    }
    if (n.t === 'label') { S.i++; continue; }
    if (n.t === 'goto') { S.i = labelIndex(n.go); continue; }
    if (n.t === 'if') { S.i = n.c(S) ? labelIndex(n.go) : S.i + 1; continue; }
    // 選項每次進入都重新洗牌，人格特質不會固定在同一個位置
    if (n.t === 'choice') n._order = shuffle(n.opts.map((_, k) => k));
    if (n.t === 'build') { n._fill = []; n._orders = n.slots.map(sl => shuffle(sl.opts.map((_, k) => k))); }
    return;
  }
}

function next() {
  if (S.queue.length) {
    S.queue.shift();
    if (S.queue.length) return render();
  }
  if (S.jump) { S.i = labelIndex(S.jump); S.jump = null; }
  else S.i++;
  advance();
  render();
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function applyEffect(x) {
  if (!x) return;
  if (x.d) for (const k in x.d) {
    const before = S.st[k] ?? 50;
    S.st[k] = Math.max(0, Math.min(100, before + x.d[k]));
    S.delta[k] = (S.delta[k] || 0) + (S.st[k] - before);
  }
  if (x.flag) Object.assign(S.f, x.flag);
  if (x.sign !== undefined) S.extra.sign = x.sign;
  if (x.board !== undefined) S.extra.board = x.board;
}

/* 機率：基礎值 p ＋ Σ 權重 ×（數值−50）/50，下限 3%，再換算成百分比 */
function odds(out) {
  const raw = out.map(o => {
    let w = o.p;
    if (o.by) for (const k in o.by) w += o.by[k] * ((S.st[k] ?? 50) - 50) / 50;
    return Math.max(0.03, w);
  });
  const sum = raw.reduce((a, b) => a + b, 0);
  return raw.map(w => w / sum);
}
function rollIndex(probs) {
  const r = Math.random();
  let acc = 0;
  for (let i = 0; i < probs.length; i++) { acc += probs[i]; if (r < acc) return { i, r }; }
  return { i: probs.length - 1, r };
}

    </div>`;
  S.delta = {};
  document.getElementById('home').onclick = () => { S = null; render(); };
  document.getElementById('restart').onclick = () => startChapter(S.ci);
  document.getElementById('prob').onclick = e => { P.showProb = !P.showProb; saveP(); e.currentTarget.setAttribute('aria-pressed', P.showProb); e.currentTarget.textContent = `機率：${P.showProb ? '顯示' : '隱藏'}`; };
  document.getElementById('trait').onclick = () => { P.showTrait = !P.showTrait; saveP(); if (!document.querySelector('.opt.picked')) render(); else { const b = document.getElementById('trait'); b.setAttribute('aria-pressed', P.showTrait); b.textContent = `選項標特質：${P.showTrait ? '顯示' : '隱藏'}`; } };
  const dlg = document.getElementById('dlg');
  if (cur) return renderSay(dlg, cur);
  ({ choice: renderChoice, roll: renderRoll, build: renderBuild, end: renderEnd })[n.t](dlg, n);
}

function whoHTML(id) {
  if (id === 'nar') return `<div class="who"><span class="nar">旁白</span></div>`;
  const me = id === chap().player;
  return `<div class="who"><span class="nm ${me ? 'me' : ''}">${CHARS[id].name}${me ? '（你）' : ''}</span></div>`;
}

function renderSay(dlg, line) {
  const text = line.text.replace('{msg}', S.vars.msg || '');
  dlg.innerHTML = `${whoHTML(line.who)}<p class="line ${line.who === 'nar' ? 'narr' : ''}" id="ln"></p><button class="next" data-primary>下一步 ▸</button>`;
  const ln = dlg.querySelector('#ln');
  const show = t => { ln.textContent = t; };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) show(text);
  else { let k = 0; typer = setInterval(() => { k += 2; show(text.slice(0, k)); if (k >= text.length) { clearInterval(typer); typer = null; } }, 28); }
  const go = () => { if (typer) { clearInterval(typer); typer = null; show(text); return; } next(); };
  dlg.onclick = go;
  dlg.querySelector('.next').onclick = e => { e.stopPropagation(); go(); };
  const actor = app.querySelector(`.actor[data-id="${line.who}"]`);
  if (actor) actor.classList.add('bounce');
}

function setMood(id, mood) {
  if (!id || !mood || !S.cast.includes(id)) return;
  S.moods[id] = mood;
  const el = app.querySelector(`.actor[data-id="${id}"]`);
  if (el) el.querySelector('svg').outerHTML = avatar(id, mood);
}

function refreshSide() {
  const side = app.querySelector('.side');
  if (side) side.outerHTML = sideHTML();
}

/* 機率條：顯示各結果的百分比，指針停在擲出的位置 */
function diceHTML(names, probs, cap) {
  return `<div class="dice">
    <div class="cap"><span>${cap}</span><span>依目前的人際數值計算</span></div>
    <div class="track">${names.map((nm, i) => `<div class="seg s${i % 4}" style="flex:${probs[i]}" title="${esc(nm)} ${Math.round(probs[i] * 100)}%"><span>${esc(nm)}</span><small>${Math.round(probs[i] * 100)}%</small></div>`).join('')}<i class="pin"></i></div>
    <div class="res" aria-live="polite"></div>
  </div>`;
}
function spinDice(box, probs, pick, r, names, done) {
  const pin = box.querySelector('.pin');
  const res = box.querySelector('.res');
  if (!P.showProb) { box.hidden = true; return done(); }
  requestAnimationFrame(() => { pin.style.left = (r * 100) + '%'; });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => {
    box.querySelectorAll('.seg')[pick].classList.add('hit');
    res.innerHTML = `結果：<b>${esc(names[pick])}</b>（機率 ${Math.round(probs[pick] * 100)}%）`;
    done();
  }, reduce ? 0 : 1150);
}

function resolveOutcomes(slot, out, record, after) {
  const probs = odds(out);
  const { i, r } = rollIndex(probs);
  const names = out.map(o => o.name);
  const box = document.createElement('div');
  box.innerHTML = diceHTML(names, probs, '可能的發展');
  slot.appendChild(box);
  spinDice(box.querySelector('.dice'), probs, i, r, names, () => {
    const o = out[i];
    record.out = o.name; record.pct = Math.round(probs[i] * 100);
    applyEffect(o);
    S.queue = (o.lines || []).map(toLine);
    if (o.goto) S.jump = o.goto;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<button class="btn" data-primary>看看發生什麼 ▸</button>';
    slot.appendChild(row);
    row.querySelector('button').onclick = after;
    row.querySelector('button').focus({ preventScroll: true });
  });
}

function continueQueue() {
  // 先插入佔位，讓 next() 的 shift 從結果的第一句開始
  if (S.queue.length) S.queue.unshift(null);
  next();
}

function renderChoice(dlg, n) {
  dlg.innerHTML = `<p class="q">${n.q}</p>
    <div class="opts">${n._order.map((k, j) => { const o = n.opts[k]; return `<button class="opt t-${o.tr}" data-k="${k}"><span class="k">${LETTERS[j]}</span><span>${esc(o.text)}</span>${P.showTrait ? tchip(o.tr) : ''}</button>`; }).join('')}</div>
    <div id="slot"></div>`;
  dlg.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const o = n.opts[+b.dataset.k];
    dlg.querySelectorAll('.opt').forEach(x => x.disabled = true);
    b.classList.add('picked');
    setMood(chap().player, o.mood);
    applyEffect(o);
    S.T[o.tr]++;
    const record = { q: n.q, pick: o.text, note: o.note, k: o.k, v: o.v, tr: o.tr };
    S.hist.push(record);
    if (o.goto) S.jump = o.goto;
    const slot = dlg.querySelector('#slot');
    slot.innerHTML = `<div class="picked-info">這個選擇偏向 ${tchip(o.tr)}<span>${TRAITS[o.tr].desc}</span></div>`;
    refreshSide();
    if (o.out) return resolveOutcomes(slot, o.out, record, continueQueue);
    S.queue = (o.lines || []).map(toLine);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<button class="btn" data-primary>繼續 ▸</button>';
    slot.appendChild(row);
    row.querySelector('button').onclick = continueQueue;
    row.querySelector('button').focus({ preventScroll: true });
  });
}

function renderRoll(dlg, n) {
  dlg.innerHTML = `<p class="q">${n.q}</p><div class="row"><button class="btn" data-primary id="go">揭曉 ▸</button></div><div id="slot"></div>`;
  dlg.querySelector('#go').onclick = e => {
    e.currentTarget.parentElement.remove();
    const record = { q: n.q, pick: null };
    S.hist.push(record);
    resolveOutcomes(dlg.querySelector('#slot'), n.out, record, continueQueue);
  };
}

function renderBuild(dlg, n) {
  const at = n._fill.length;
  if (at === n.slots.length) {
    const sum = n._fill.reduce((a, k, j) => a + n.slots[j].opts[k].w, 0);
    S.st.msg = Math.max(0, Math.min(100, 50 + sum * 8));
    S.vars.msg = n._fill.map((k, j) => n.slots[j].opts[k].text).join('');
    n._fill.forEach((k, j) => { const o = n.slots[j].opts[k]; S.hist.push({ q: `說話：${n.slots[j].label}`, pick: o.text, note: o.note, k: 'imsg', v: o.w > 0 ? 1 : -1, tr: o.tr }); });
    return next();
  }
  dlg.innerHTML = `<p class="q">${n.q}</p>
    <div class="msg">${n.slots.map((sl, j) => `<div class="slot ${j < at ? 'filled' : j === at ? 'now' : ''}"><span class="n">${j + 1}</span><span class="t">${j < at ? esc(sl.opts[n._fill[j]].text) : sl.label + (j === at ? '：請選一句' : '')}</span></div>`).join('')}</div>
    <div class="opts">${n._orders[at].map((k, j) => { const o = n.slots[at].opts[k]; return `<button class="opt t-${o.tr}" data-k="${k}"><span class="k">${LETTERS[j]}</span><span>${esc(o.text)}</span>${P.showTrait ? tchip(o.tr) : ''}</button>`; }).join('')}</div>`;
  dlg.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const o = n.slots[at].opts[+b.dataset.k];
    S.T[o.tr]++;
    n._fill.push(+b.dataset.k);
    refreshSide();
    renderBuild(dlg, n);
  });
}

/* ================= 結局與總體建議 ================= */
function pickEnding(ch) {
  const forced = ch.endings.find(e => e.force && e.force(S));
  const list = ch.endings.filter(e => !e.force);
  if (forced) return { e: forced, probs: null, list };
  const ws = list.map(e => Math.pow(Math.max(0, e.w(S)) + 2, 2));
  const sum = ws.reduce((a, b) => a + b, 0);
  const probs = ws.map(w => w / sum);
  const { i, r } = rollIndex(probs);
  return { e: list[i], probs, list, i, r };
}

function oceanHTML() {
  const total = TKEYS.reduce((a, t) => a + S.T[t], 0) || 1;
  const sorted = TKEYS.slice().sort((a, b) => S.T[b] - S.T[a]);
  const top = sorted.filter(t => S.T[t] > 0 && S.T[t] === S.T[sorted[0]]);
  const second = sorted.find(t => !top.includes(t) && S.T[t] > 0);
  const low = TKEYS.filter(t => S.T[t] === 0);
  return `<div class="card advice">
    <h4>你的人格傾向</h4>
    <div class="ocean-result">${TKEYS.map(t => `<div class="ocean-row t-${t}"><span>${t}　${TRAITS[t].name}</span><div class="bar"><i class="tc" style="width:${Math.round(S.T[t] / total * 100)}%"></i></div><span>${Math.round(S.T[t] / total * 100)}%</span></div>`).join('')}</div>
    <p>這次你最常用 ${top.map(tchip).join(' ')} 的方式回應${second ? `，其次是 ${tchip(second)}` : ''}。人格特質沒有好壞，每一種都有它的優勢，也有需要留意的地方。這只代表你在這個故事裡的選擇，不是正式的人格測驗。</p>
    ${top.map(t => `<div class="adv-item"><b>${TRAITS[t].name}的優勢</b><span>${TRAITS[t].str}</span></div><div class="adv-item"><b>${TRAITS[t].name}要留意</b><span>${TRAITS[t].tip}</span></div>`).join('')}
    ${low.length ? `<div class="adv-item"><b>可以試試看</b><span>這次你很少選 ${low.map(tchip).join(' ')} 的回應。下次換一種方式，看看故事會不會走向不同結局。</span></div>` : ''}
  </div>`;
}

function adviceHTML(ch) {
  const tally = {};
  S.hist.forEach(h => { if (!h.k) return; const t = tally[h.k] = tally[h.k] || { p: 0, n: 0 }; h.v > 0 ? t.p++ : t.n++; });
  const good = [], mix = [], grow = [];
  for (const k in ch.skills) {
    const sk = ch.skills[k], t = tally[k];
    if (!t) continue;
    if (t.n === 0) good.push(`<div class="adv-item"><b>${sk.name}</b><span>${sk.good}</span></div>`);
    else if (t.p > 0) mix.push(`<div class="adv-item"><b>${sk.name}</b><span>有時做到了，有時還可以更好。${sk.tip}</span></div>`);
    else grow.push(`<div class="adv-item"><b>${sk.name}</b><span>${sk.tip}</span></div>`);
  }
  const statLines = ch.meters
    .map(m => ({ m, bad: m.bad ? S.st[m.id] - 50 : 50 - S.st[m.id] }))
    .filter(x => x.bad > 5 && ch.statTips[x.m.id])
    .sort((a, b) => b.bad - a.bad).slice(0, 2)
    .map(x => `<div class="adv-item"><span>${ch.statTips[x.m.id]}</span></div>`);
  const total = Object.values(tally).reduce((a, t) => a + t.p + t.n, 0);
  const posCount = Object.values(tally).reduce((a, t) => a + t.p, 0);
  const ratio = total ? posCount / total : 0;
  const overall = ratio >= .8 ? '你在這段故事裡，大多選擇了能拉近關係的做法。好的做法讓好結果更可能發生，但不保證每次都成功；遇到不順利時，別氣餒，繼續用真誠經營。'
    : ratio >= .45 ? '你的選擇有好有壞，關係也跟著起起伏伏，這很真實！留意下方「可以再加強」的地方，下次換個做法，看看故事會怎麼改變。'
    : '這次故事走得比較辛苦。人際關係不佳可能帶來困擾，但每一次衝突都是學習的機會。從下方的建議挑一項，再玩一次看看結果有什麼不同。';
  return `<div class="card advice">
    <h4>總體建議</h4>
    <p>${overall}</p>
    ${good.length ? `<div class="adv-group good"><span>做得好的地方</span>${good.join('')}</div>` : ''}
    ${mix.length ? `<div class="adv-group mix"><span>持續練習</span>${mix.join('')}</div>` : ''}
    ${grow.length ? `<div class="adv-group grow"><span>可以再加強</span>${grow.join('')}</div>` : ''}
    ${statLines.length ? `<div class="adv-group mix"><span>從關係數值來看</span>${statLines.join('')}</div>` : ''}
  </div>`;
}

function renderEnd(dlg) {
  const ch = chap();
  if (!S.ending) S.ending = pickEnding(ch);
  const { e, probs, list, i, r } = S.ending;
  const text = typeof e.text === 'function' ? e.text(S) : e.text;
  const got = P.ends[ch.id] || [];
  if (!got.includes(e.id)) P.ends[ch.id] = got.concat(e.id);
  if (ch.id === 'c2') P.carry = { xz: S.st.xz, calm: S.st.calm, end: e.id };
  saveP();
  const nextIdx = S.ci + 1 < CHAPTERS.length ? S.ci + 1 : null;
  const good = ['star', 'bestie', 'peace', 'ready', 'up'].includes(e.id);
  S.cast.forEach(id => setMood(id, good ? 'smile' : 'neutral'));
  dlg.innerHTML = `<div class="result">
      <span class="qtag">${ch.no}・結局</span>
      ${probs ? `<div id="endDice">${diceHTML(list.map(x => x.title), probs, '結局機率（依最後的人際數值）')}</div>` : ''}
      <div id="endBody" ${probs && P.showProb ? 'hidden' : ''}>
        <div class="result">
          <h2 class="end-title pop">${e.title}</h2>
          <p class="end-text">${text}</p>
          ${oceanHTML()}
          ${adviceHTML(ch)}
          <details class="card more"><summary>回顧你的選擇（${S.hist.filter(h => h.pick).length} 次）</summary>
            <div class="review">${S.hist.map(h => `<div class="rev ${h.tr ? 't-' + h.tr : ''}"><span class="rq">${esc(h.q)}</span>${h.pick ? `<span>${esc(h.pick)}</span>` : ''}${h.tr ? `<span>${tchip(h.tr)}</span>` : ''}${h.out ? `<span class="ro">→ ${esc(h.out)}（${h.pct}%）</span>` : ''}${h.note ? `<span class="rn">${esc(h.note)}</span>` : ''}</div>`).join('')}</div>
          </details>
          <div class="card"><h4>寫下來</h4>
            <p>${ch.id === 'c1' ? '你覺得自己在人際相處上的優勢是什麼？想精進哪一點？要如何精進？' : ch.id === 'c2' ? '如果你是小甄，會如何利用「我訊息」向小藝表達不滿？' : '如果衝突沒有解決，你認為會對人際關係以及健康產生什麼影響？'}</p>
            <textarea id="note-${ch.id}" placeholder="寫下你的想法（只存在這台裝置）">${esc(P.notes[ch.id] || '')}</textarea>
          </div>
          <div class="row"><button class="btn alt" id="again">再玩一次，試試別的結局</button><button class="btn alt" id="menu">回到選單</button>${nextIdx != null ? `<button class="btn" id="nx">前往${CHAPTERS[nextIdx].no} ▸</button>` : ''}</div>
        </div>
      </div>
    </div>`;
  const ta = dlg.querySelector('textarea');
  ta.oninput = () => { P.notes[ch.id] = ta.value; saveP(); };
  dlg.querySelector('#again').onclick = () => startChapter(S.ci);
  dlg.querySelector('#menu').onclick = () => { S = null; render(); };
  if (nextIdx != null) dlg.querySelector('#nx').onclick = () => startChapter(nextIdx);
  // 結局揭曉後才更新側欄的結局收集，避免先劇透
  const reveal = () => { dlg.querySelector('#endBody').hidden = false; refreshSide(); };
  if (probs) spinDice(dlg.querySelector('#endDice .dice'), probs, i, r, list.map(x => x.title), reveal);
  else reveal();
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (e.target.closest && (e.target.closest('textarea') || e.target.closest('button') || e.target.closest('summary'))) return;
  const b = [...document.querySelectorAll('.dialog [data-primary]')].find(x => !x.closest('[hidden]'));
  if (b) { e.preventDefault(); b.click(); }
});

render();
</script>
